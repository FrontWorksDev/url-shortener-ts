name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check
            command: bun run typecheck
          - name: Biome
            command: bun run check:ci
          - name: Test
            command: bun test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve expected Bun version from .tool-versions
        id: expected-bun
        run: |
          VERSION=$(awk '$1 == "bun" { print $2; exit }' .tool-versions)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find 'bun' entry in .tool-versions"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.expected-bun.outputs.version }}

      - name: Verify resolved Bun version matches .tool-versions
        env:
          EXPECTED: ${{ steps.expected-bun.outputs.version }}
          ACTUAL: ${{ steps.setup-bun.outputs.bun-version }}
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Bun version mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "Bun version verified: $ACTUAL"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
